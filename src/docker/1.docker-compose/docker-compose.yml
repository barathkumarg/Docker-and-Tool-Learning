version: '3.8'

services:
  web:
    build: .
    container_name: web_app
    ports:
      - "5000:5000"
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      - FLASK_ENV=development
      - REDIS_HOST=redis
    entrypoint: ["python", "app.py"]
    command: ["--host", "0.0.0.0", "--port", "5000"]
    networks:
      - app-network
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    command: redis-server --appendonly yes
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-app

volumes:
  redis-data:
    driver: local
